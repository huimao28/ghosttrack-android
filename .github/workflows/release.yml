name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore Gradle wrapper jar if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.jar.b64 ]; then
            base64 -d gradle/wrapper/gradle-wrapper.jar.b64 > gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed release keystore
        env:
          HUIMAO_KEYSTORE_BASE64: ${{ secrets.HUIMAO_KEYSTORE_BASE64 }}
        run: |
          test -n "$HUIMAO_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$HUIMAO_KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      - name: Build signed release APK and AAB
        env:
          HUIMAO_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          HUIMAO_KEYSTORE_PASSWORD: ${{ secrets.HUIMAO_KEYSTORE_PASSWORD }}
          HUIMAO_KEY_PASSWORD: ${{ secrets.HUIMAO_KEYSTORE_PASSWORD }}
          HUIMAO_KEY_ALIAS: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew :app:assembleRelease :app:bundleRelease --console=plain --stacktrace
          mkdir -p release-files
          cp app/build/outputs/apk/release/app-release.apk "release-files/GhostTrack_${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-files/GhostTrack_${VERSION}.aab"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GhostTrack-release
          path: |
            release-files/*.apk
            release-files/*.aab

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GhostTrack v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            release-files/*.apk
            release-files/*.aab
